name: build-pikafish

# 只负责把皮卡鱼编译成 iOS arm64 静态库，出包那套流程完全不受影响。
# 编译成功 → 上传 libpikafish.a；失败 → 只在这里红，App 照旧能出包。

on:
  push:
    paths:
      - '.github/workflows/build-pikafish.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 选 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: 克隆皮卡鱼
        run: |
          git clone --depth 1 https://github.com/official-pikafish/Pikafish.git pf
          ls pf
          ls pf/scripts

      - name: 下网络文件
        run: |
          cd pf/src
          sh ../scripts/net.sh || true
          ls -la *.nnue || true

      - name: 用官方 Makefile 编（iOS arm64）
        run: |
          set -x
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          cd pf/src
          make -j4 build ARCH=apple-silicon COMP=clang \
            EXTRACXXFLAGS="-isysroot $SDK -mios-version-min=16.0 -fPIC" \
            2>&1 | tail -40
          set +x
          echo "=== 目标文件 ==="
          find . -name '*.o' | head -20
          echo "=== 归档 ==="
          FILES=$(find . -name '*.o')
          if [ -n "$FILES" ]; then xcrun libtool -static -o libpikafish.a $FILES; fi
          ls -la libpikafish.a || echo "没有静态库"

      - name: 上传
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pikafish-lib
          path: pf/src/libpikafish.a
          if-no-files-found: warn
