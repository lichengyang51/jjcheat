name: build-ios-app

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/app/**'
      - 'src/**'
      - 'dist/**'
      - '.github/workflows/build-ios-app.yml'

jobs:
  build:
    # 必须 Xcode 16：新版 XcodeGen 生成 objectVersion 77，Xcode 15 读不了
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: 查看工具链版本
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: 安装 XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: 打包引擎脚本
        run: |
          node tools/bundle.js
          mkdir -p ios/app/JJCheatApp/Resources
          cp dist/engine.js ios/app/JJCheatApp/Resources/engine.js
          ls -la ios/app/JJCheatApp/Resources/

      - name: 生成 Xcode 工程
        run: |
          cd ios/app
          xcodegen generate
          echo "--- 生成的工程 ---"
          ls -la
          echo "--- objectVersion ---"
          grep -m1 objectVersion JJCheat.xcodeproj/project.pbxproj || true
          echo "--- schemes ---"
          ls -la JJCheat.xcodeproj/xcshareddata/xcschemes/ || true
          echo "--- 确认 engine.js 在 pbxproj 里被引用 ---"
          grep -c "engine.js" JJCheat.xcodeproj/project.pbxproj || true

      - name: 编译（免签名）
        run: |
          cd ios/app
          set -o pipefail
          xcodebuild \
            -project JJCheat.xcodeproj \
            -scheme JJCheatApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: 打未签名 ipa
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name "JJCheatApp.app" -maxdepth 3 | head -1)
          echo "app = $APP"
          test -d "$APP"
          echo "--- app 内容 ---"
          ls -la "$APP"
          echo "--- 硬性校验 ---"
          test -f "$APP/engine.js"                       || (echo "!!! engine.js 没打进去" && exit 1)
          test -f "$APP/Info.plist"                      || (echo "!!! 缺 Info.plist" && exit 1)
          test -f "$APP/PlugIns/JJCheatBroadcast.appex/JJCheatBroadcast" || (echo "!!! 缺录屏扩展" && exit 1)
          echo "engine.js  = $(wc -c < "$APP/engine.js") 字节"
          echo "主程序     = $(wc -c < "$APP/JJCheatApp") 字节"
          echo "扩展       = $(wc -c < "$APP/PlugIns/JJCheatBroadcast.appex/JJCheatBroadcast") 字节"
          cd "$RUNNER_TEMP"
          rm -rf Payload JJCheat-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry JJCheat-unsigned.ipa Payload
          ls -la JJCheat-unsigned.ipa
          echo "--- ipa 内容 ---"
          unzip -l JJCheat-unsigned.ipa

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: JJCheat-ipa
          path: ${{ runner.temp }}/JJCheat-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
