name: build-ios-app

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/app/**'
      - 'src/**'
      - 'dist/**'
      - '.github/workflows/build-ios-app.yml'

jobs:
  build:
    # 必须 Xcode 16：新版 XcodeGen 生成 objectVersion 77，Xcode 15 读不了
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: 查看工具链版本
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: 安装 XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: 打包引擎脚本
        run: |
          node tools/bundle.js
          mkdir -p ios/app/JJCheatApp/Resources
          cp dist/engine.js ios/app/JJCheatApp/Resources/engine.js
          ls -la ios/app/JJCheatApp/Resources/

      # 皮卡鱼（Pikafish，Stockfish 的中国象棋版，NNUE）：编成 iOS arm64 静态库。
      # 关键：pikafish.nnue（50MB）必须和 App 一起打包，否则引擎在 dyld 初始化
      # 阶段找不到网络文件会直接 exit —— 那就是「点图标闪退」。
      - name: 编译皮卡鱼 + 打包网络文件
        run: |
          set -e
          mkdir -p ios/app/native
          if [ ! -d ios/app/native/pikafish ]; then
            git clone --depth 1 https://github.com/official-pikafish/Pikafish.git ios/app/native/pikafish
          fi
          cd ios/app/native/pikafish/src
          sh ../scripts/net.sh
          ls -la pikafish.nnue
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          make -j4 build ARCH=apple-silicon COMP=clang \
            EXTRACXXFLAGS="-isysroot $SDK -mios-version-min=16.0 -fPIC"
          FILES=$(find . -name '*.o')
          xcrun libtool -static -o libpikafish.a $FILES
          ls -la libpikafish.a
          # 网络文件放进 App 的 Resources（会落在 .app 根目录，跟可执行文件同级）
          cp pikafish.nnue ../../../JJCheatApp/Resources/pikafish.nnue
          ls -la ../../../JJCheatApp/Resources/ | head

      - name: 生成 Xcode 工程
        run: |
          cd ios/app
          xcodegen generate
          echo "--- 生成的工程 ---"
          ls -la
          echo "--- objectVersion ---"
          grep -m1 objectVersion JJCheat.xcodeproj/project.pbxproj || true
          echo "--- schemes ---"
          ls -la JJCheat.xcodeproj/xcshareddata/xcschemes/ || true
          echo "--- 确认 engine.js 在 pbxproj 里被引用 ---"
          grep -c "engine.js" JJCheat.xcodeproj/project.pbxproj || true

      - name: 编译（免签名）
        run: |
          cd ios/app
          set -o pipefail
          # 构建标记：UTC 时间 + 短提交号，每次编译都不一样，界面上会显示
          BUILD_TAG="$(date -u '+%m%d-%H%M')-$(git rev-parse --short HEAD)"
          echo "BUILD_TAG=$BUILD_TAG"
          xcodebuild \
            -project JJCheat.xcodeproj \
            -scheme JJCheatApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION="$BUILD_TAG" \
            MARKETING_VERSION="1.0.0" \
            build

      - name: 打未签名 ipa
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name "JJCheatApp.app" -maxdepth 3 | head -1)
          echo "app = $APP"
          test -d "$APP"
          echo "--- app 内容 ---"
          ls -la "$APP"
          echo "--- 硬性校验 ---"
          test -f "$APP/engine.js"                       || (echo "!!! engine.js 没打进去" && exit 1)
          test -f "$APP/Info.plist"                      || (echo "!!! 缺 Info.plist" && exit 1)
          echo "engine.js  = $(wc -c < "$APP/engine.js") 字节"
          echo "主程序     = $(wc -c < "$APP/JJCheatApp") 字节"
          cd "$RUNNER_TEMP"
          rm -rf Payload JJCheat-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry JJCheat-unsigned.ipa Payload
          ls -la JJCheat-unsigned.ipa
          echo "--- ipa 内容 ---"
          unzip -l JJCheat-unsigned.ipa

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: JJCheat-ipa
          path: ${{ runner.temp }}/JJCheat-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
