name: JJCheat
options:
  bundleIdPrefix: com.fujiang
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    ONLY_ACTIVE_ARCH: NO
    CURRENT_PROJECT_VERSION: "dev"

schemes:
  JJCheatApp:
    build:
      targets:
        JJCheatApp: all
        JJCheatBroadcast: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  JJCheatApp:
    type: application
    platform: iOS
    sources:
      - path: JJCheatApp
        excludes:
          - "Info.plist"
          - "*.entitlements"
          - "Resources/**"
      - path: JJCheatApp/Resources
        buildPhase: resources
      - path: Shared
    info:
      path: JJCheatApp/Info.plist
      properties:
        CFBundleDisplayName: 象棋强软
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # 画中画浮窗要在切到别的 App 之后继续活着，必须有这个后台模式
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: 拍棋盘照片，用来识别当前局面并给出着法。照片只在本机处理，不会上传。
        NSPhotoLibraryUsageDescription: 选择棋盘照片或读取刚截的截图，用来识别当前局面并给出着法。照片只在本机处理，不会上传。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fujiang.jjcheat
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        # Swift 要调 Objective-C 的 PikafishBridge，需要 bridging header
        SWIFT_OBJC_BRIDGING_HEADER: JJCheatApp/Bridge/JJCheat-Bridging-Header.h
        # 皮卡鱼源码在 CI 里 clone 到 ios/native/pikafish（本地没有时只是编成空实现）
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/native/pikafish/src"
        # 静态库由 CI 编出来；万一没编成会放一个空库，链接不会失败
        OTHER_LDFLAGS:
          - "-force_load"
          - "$(SRCROOT)/native/pikafish/src/libpikafish.a"
    dependencies:
      - target: JJCheatBroadcast
        embed: true

  JJCheatBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: JJCheatBroadcast
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    info:
      path: JJCheatBroadcast/Info.plist
      properties:
        CFBundleDisplayName: 象棋强软 录屏
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fujiang.jjcheat.broadcast
        TARGETED_DEVICE_FAMILY: "1"
